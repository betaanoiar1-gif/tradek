[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-school-ai"
version = "1.0.0"
description = "Trading School AI - Python student, LLM teacher, statistics judge."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "typer>=0.9",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["httpx>=0.25"]
dev = ["pytest>=7.4", "import-linter>=1.12"]

[project.scripts]
tsa = "trading_school_ai.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
