[importlinter]
root_package = trading_school_ai

[importlinter:contract:ai-isolation]
name = AI must not import risk/execution
type = forbidden
source_modules =
    trading_school_ai.ai
    trading_school_ai.research
forbidden_modules =
    trading_school_ai.risk
    trading_school_ai.execution

[importlinter:contract:risk-no-llm]
name = Risk must not depend on LLM
type = forbidden
source_modules =
    trading_school_ai.risk
forbidden_modules =
    trading_school_ai.ai

[importlinter:contract:backtest-no-execution]
name = Backtest must not use live execution
type = forbidden
source_modules =
    trading_school_ai.backtest
forbidden_modules =
    trading_school_ai.execution
    trading_school_ai.ai

[importlinter:contract:learning-no-live]
name = Learning must not import execution or risk
type = forbidden
source_modules =
    trading_school_ai.learning
    trading_school_ai.experiment
forbidden_modules =
    trading_school_ai.execution
